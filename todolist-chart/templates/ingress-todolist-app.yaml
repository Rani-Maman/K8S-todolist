apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "todolist.fullname" . }}-todolist-app
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "8"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.host }}
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /create
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
      - path: /edit
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
      - path: /delete
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
  {{- else }}
  rules:
  - http:
      paths:
      - path: /create
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
      - path: /edit
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
      - path: /delete
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: {{ include "todolist.todolistAppName" . }}
            port:
              number: 5000
  {{- end }}
