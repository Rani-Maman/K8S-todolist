{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todolist.mariadbName" . }}-ingress
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todolist.selectorLabels" (dict "app" .Values.names.mariadb "root" .) | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "todolist.selectorLabels" (dict "app" .Values.names.todosApi "root" .) | nindent 10 }}
    - podSelector:
        matchLabels:
          {{- include "todolist.selectorLabels" (dict "app" .Values.names.todolistApp "root" .) | nindent 10 }}
    ports:
    - protocol: TCP
      port: 3306
{{- end }}

