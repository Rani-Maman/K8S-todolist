{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todolist.todolistAppName" . }}-ingress-egress
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todolist.selectorLabels" (dict "app" .Values.names.todolistApp "root" .) | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "todolist.selectorLabels" (dict "app" .Values.names.mariadb "root" .) | nindent 10 }}
    ports:
    - protocol: TCP
      port: 3306
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
{{- end }}

