{{- if and .Values.titleImage.enabled .Values.titleImage.base64 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todolist.titleImageName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
data:
  TITLE_IMAGE_BASE64: {{ .Values.titleImage.base64 | quote }}
binaryData:
  title-image.png: {{ .Values.titleImage.base64 | quote }}
{{- end }}
