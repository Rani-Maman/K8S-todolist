{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "todolist.todolistVueName" . }}-hpa
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "todolist.todolistVueName" . }}
  minReplicas: {{ .Values.hpa.todolistVue.minReplicas }}
  maxReplicas: {{ .Values.hpa.todolistVue.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.hpa.todolistVue.targetCPUUtilizationPercentage }}
{{- end }}
