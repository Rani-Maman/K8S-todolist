apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todolist.defaultBackendName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
    {{- include "todolist.selectorLabels" (dict "app" .Values.names.defaultBackend "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.defaultBackend }}
  selector:
    matchLabels:
      {{- include "todolist.selectorLabels" (dict "app" .Values.names.defaultBackend "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todolist.selectorLabels" (dict "app" .Values.names.defaultBackend "root" .) | nindent 8 }}
    spec:
      containers:
      - name: default-backend
        image: {{ .Values.images.defaultBackend.repository }}:{{ .Values.images.defaultBackend.tag }}
        args:
        - "-text=default backend"
        - "-listen=:8080"
        ports:
        - name: http
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todolist.defaultBackendName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "todolist.selectorLabels" (dict "app" .Values.names.defaultBackend "root" .) | nindent 4 }}
  ports:
  - name: http
    port: 8080
    targetPort: 8080

