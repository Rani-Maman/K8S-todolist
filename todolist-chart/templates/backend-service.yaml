apiVersion: v1
kind: Service
metadata:
  name: {{ include "todolist.mariadbName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "todolist.selectorLabels" (dict "app" .Values.names.mariadb "root" .) | nindent 4 }}
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306

