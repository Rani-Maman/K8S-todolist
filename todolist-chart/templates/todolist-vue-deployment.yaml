apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todolist.todolistVueName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
    {{- include "todolist.selectorLabels" (dict "app" .Values.names.todolistVue "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.todolistVue }}
  selector:
    matchLabels:
      {{- include "todolist.selectorLabels" (dict "app" .Values.names.todolistVue "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todolist.selectorLabels" (dict "app" .Values.names.todolistVue "root" .) | nindent 8 }}
    spec:
      initContainers:
      - name: wait-for-api
        image: busybox:1.36
        command: ["sh", "-c", 'until nc -z {{ include "todolist.todosApiName" . }} 8080; do echo waiting for api; sleep 2; done']
      containers:
      - name: todolist-vue
        image: {{ .Values.images.todolistVue.repository }}:{{ .Values.images.todolistVue.tag }}
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: API_BASE_URL
          value: {{ .Values.API_BASE_URL | quote }}
        - name: USER
          value: {{ .Values.USER | quote }}
        {{- if and .Values.titleImage.enabled .Values.titleImage.base64 }}
        - name: TITLE_IMAGE_BASE64
          valueFrom:
            configMapKeyRef:
              name: {{ include "todolist.titleImageName" . }}
              key: TITLE_IMAGE_BASE64
        {{- end }}
        {{- with .Values.resources.todolistVue }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        {{- if and .Values.titleImage.enabled .Values.titleImage.base64 }}
        volumeMounts:
        - name: title-image
          mountPath: /opt/images/title-image.png
          subPath: title-image.png
          readOnly: true
        {{- end }}
      {{- if and .Values.titleImage.enabled .Values.titleImage.base64 }}
      volumes:
      - name: title-image
        configMap:
          name: {{ include "todolist.titleImageName" . }}
          items:
          - key: title-image.png
            path: title-image.png
      {{- end }}

