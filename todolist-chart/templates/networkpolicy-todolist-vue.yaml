{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todolist.todolistVueName" . }}-ingress
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todolist.selectorLabels" (dict "app" .Values.names.todolistVue "root" .) | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 8080
{{- end }}

