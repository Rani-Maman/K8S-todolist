apiVersion: v1
kind: Namespace
metadata:
  name: todolist
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todolist-config
  namespace: todolist
data:
  MYSQL_DB: "todo"
  MYSQL_HOST: "backend"
  MYSQL_USER: "root"
---
# todolist-secret is generated by kustomize from secret.env (git-ignored) - see kustomization.yaml
# enables root@% so the app can connect from another pod
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
  namespace: todolist
data:
  00-allow-remote-root.sh: |
    #!/bin/sh
    set -e
    echo "Configuring remote root access."
    mariadb -uroot -p"${MARIADB_ROOT_PASSWORD}" -e "
      CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
      GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
      FLUSH PRIVILEGES;
    "
    echo "Remote root enabled."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: todolist
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: todolist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: mariadb
        image: mariadb:latest
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: todolist-config
              key: MYSQL_DB
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todolist-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MARIADB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: todolist-config
              key: MYSQL_DB
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todolist-secret
              key: MYSQL_ROOT_PASSWORD
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mariadb-data
        persistentVolumeClaim:
          claimName: mariadb-pvc
      - name: initdb
        configMap:
          name: mariadb-init
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: todolist
spec:
  selector:
    app: backend
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: todolist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ["sh","-c","until nc -z backend 3306; do echo waiting for db; sleep 2; done"]
      containers:
      - name: todolist
        image: ghcr.io/bennyro-mta/todolist:1.9
        ports:
        - name: http
          containerPort: 5000
        envFrom:
        - configMapRef:
            name: todolist-config
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todolist-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todolist-secret
              key: MYSQL_ROOT_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: todolist
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    port: 5000
    targetPort: 5000
