apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: todolist
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: mariadb-backup
            image: alpine:3.19
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              DATE=$(date "+%Y%m%d-%H%M")
              DEST="/backup/$DATE"
              mkdir -p "$DEST"
              cp -a /var/lib/mysql/. "$DEST"/
              echo "Backup completed to $DEST"
            volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
              readOnly: true
            - name: mariadb-backup
              mountPath: /backup
          volumes:
          - name: mariadb-data
            persistentVolumeClaim:
              claimName: mariadb-data-backend-0
          - name: mariadb-backup
            persistentVolumeClaim:
              claimName: mariadb-backup-pvc
